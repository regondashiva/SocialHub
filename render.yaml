services:
  # Backend Node.js API Service
  - type: web
    name: socialhub-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ML_API_URL
        fromService:
          type: web
          name: socialhub-ml
          property: host
      - key: CLIENT_URL
        sync: false

  # Frontend Static Site
  - type: web
    name: socialhub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: socialhub-backend
          property: host
          path: /api

  # Python ML Service
  - type: web
    name: socialhub-ml
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
