version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: socialmedia_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: socialmedia
    volumes:
      - mongodb_data:/data/db
    networks:
      - socialmedia_network

  redis:
    image: redis:7-alpine
    container_name: socialmedia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - socialmedia_network

  ml_service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: socialmedia_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - socialmedia_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialmedia_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/socialmedia
      JWT_SECRET: your-super-secret-jwt-key-change-this
      REDIS_URL: redis://redis:6379
      ML_API_URL: http://ml_service:8000
      CLIENT_URL: http://localhost:80,http://localhost:3000,http://localhost:5173
    depends_on:
      - mongodb
      - redis
      - ml_service
    networks:
      - socialmedia_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: socialmedia_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - socialmedia_network

volumes:
  mongodb_data:

networks:
  socialmedia_network:
    driver: bridge
